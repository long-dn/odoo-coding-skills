name: Rebuild distributions

on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/build-dist.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build all distributions
        run: python scripts/build.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet dist/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit rebuilt dist/ (push only)
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: rebuild dist/ from skills/ source"
          git push

      - name: Show diff (PR only)
        if: steps.changes.outputs.changed == 'true' && github.event_name == 'pull_request'
        run: |
          echo "::warning::dist/ is out of sync with skills/. Run 'python scripts/build.py' locally and commit the result."
          git diff dist/ | head -200
          exit 1
